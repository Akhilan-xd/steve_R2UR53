controller_manager:
  ros__parameters:

    # Match Gazebo's 1 ms step. A slower manager lets gravity move the arm
    # between position updates, which shows up as a shake at the gripper.
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    pan_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController


speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "ur5e"

io_and_status_controller:
  ros__parameters:
    tf_prefix: "ur5e"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: ur5etcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: ur5etool0
    topic_name: ft_data


joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur5eshoulder_pan_joint
      - ur5eshoulder_lift_joint
      - ur5eelbow_joint
      - ur5ewrist_1_joint
      - ur5ewrist_2_joint
      - ur5ewrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Gazebo PID cannot hold a tight path band on a wrist flip into the grasp.
    # 0 disables the check; 1.0 rad still rejects a plan that starts at the
    # spawn pose while the arm is already at ready (~1.6 rad on wrist_2).
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 2.0
      ur5eshoulder_pan_joint: { trajectory: 1.0, goal: 0.2 }
      ur5eshoulder_lift_joint: { trajectory: 1.0, goal: 0.2 }
      ur5eelbow_joint: { trajectory: 1.0, goal: 0.2 }
      ur5ewrist_1_joint: { trajectory: 1.0, goal: 0.2 }
      ur5ewrist_2_joint: { trajectory: 1.0, goal: 0.2 }
      ur5ewrist_3_joint: { trajectory: 1.0, goal: 0.2 }


scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur5eshoulder_pan_joint
      - ur5eshoulder_lift_joint
      - ur5eelbow_joint
      - ur5ewrist_1_joint
      - ur5ewrist_2_joint
      - ur5ewrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur5eshoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur5eshoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur5eelbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur5ewrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    speed_scaling_interface_name: ur5espeed_scaling/speed_scaling_factor

forward_velocity_controller:
  ros__parameters:
    joints:
      - ur5eshoulder_pan_joint
      - ur5eshoulder_lift_joint
      - ur5eelbow_joint
      - ur5ewrist_1_joint
      - ur5ewrist_2_joint
      - ur5ewrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - ur5eshoulder_pan_joint
      - ur5eshoulder_lift_joint
      - ur5eelbow_joint
      - ur5ewrist_1_joint
      - ur5ewrist_2_joint
      - ur5ewrist_3_joint

pan_tilt_controller:
  ros__parameters:
    joints:
      - pan_tilt_pan_motor_joint
      - pan_tilt_tilt_motor_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      pan_tilt_pan_motor_joint: { trajectory: 0.2, goal: 0.1 }
      pan_tilt_tilt_motor_joint: { trajectory: 0.2, goal: 0.1 }


robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    goal_tolerance: 0.02
    max_effort: 20.0
    allow_stalling: true
    stall_velocity_threshold: 0.01
    stall_timeout: 0.5

