# UR5e link mass and inertia at 1/5 of the catalog values.
# Link lengths and centers of mass are unchanged.
# A full stretch then weighs about 4.3 kg, light enough that the
# 240 kg base keeps the wheels on the ground.
# Physical parameters

offsets:
  shoulder_offset: 0.138 # measured from model
  elbow_offset: 0.007 # measured from model

inertia_parameters:
  base_mass: 0.8 # This mass might be incorrect
  shoulder_mass: 0.7522
  upper_arm_mass: 1.6116
  forearm_mass: 0.5692
  wrist_1_mass: 0.274
  wrist_2_mass: 0.26
  wrist_3_mass: 0.073

  shoulder_radius: 0.060   # manually measured
  upper_arm_radius: 0.054  # manually measured
  elbow_radius: 0.060      # manually measured
  forearm_radius: 0.040    # manually measured
  wrist_radius: 0.045      # manually measured

  links:
    base:
      radius: 0.06
      length: 0.05

  # model referring to https://www.universal-robots.com/articles/ur/application-installation/dh-parameters-for-calculations-of-kinematics-and-dynamics/
  center_of_mass:
    shoulder_cog:
      x: 0.0        # model.x
      y: -0.00193   # -model.z
      z: -0.02561   # model.y
    upper_arm_cog:
      x: -0.2125    # model.x - upper_arm_length
      y: 0.0        # model.y
      z: 0.11336    # model.z
    forearm_cog:
      x: -0.2422    # model.x - forearm_length
      y: 0.0        # model.y
      z: 0.0265     # model.z
    wrist_1_cog:
      x: 0.0        # model.x
      y: -0.01634   # -model.z
      z: -0.0018    # model.y
    wrist_2_cog:
      x: 0.0        # model.x
      y: 0.01634    # model.z
      z: -0.0018    # -model.y
    wrist_3_cog:
      x: 0.0        # model.x
      y: 0.0        # model.y
      z: -0.001159  # model.z

  rotation:
    shoulder:
      roll: 1.570796326794897
      pitch: 0
      yaw: 0
    upper_arm:
      roll: 0
      pitch: 0
      yaw: 0
    forearm:
      roll: 0
      pitch: 0
      yaw: 0
    wrist_1:
      roll: 1.570796326794897
      pitch: 0
      yaw: 0
    wrist_2:
      roll: -1.570796326794897
      pitch: 0
      yaw: 0
    wrist_3:
      roll: 0
      pitch: 0
      yaw: 0

  tensor:
    shoulder:
      ixx: 0.00140042
      ixy: 1.46e-07
      ixz: -2.106e-06
      iyy: 0.001296182
      iyz: 9.9988e-05
      izz: 0.001314572
    upper_arm:
      ixx: 0.00301177
      ixy: -1.08e-05
      ixz: 1.126e-06
      iyy: 0.066776172
      iyz: -3.62e-07
      izz: 0.066494414
    forearm:
      ixx: 0.000799264
      ixy: -2.73e-06
      ixz: 0.000274544
      iyy: 0.015758508
      iyz: -1.32e-06
      izz: 0.01569702
    wrist_1:
      ixx: 0.000330982
      ixy: -5.64e-07
      ixz: -8.76e-07
      iyy: 0.000271924
      iyz: 2.0314e-05
      izz: 0.000252558
    wrist_2:
      ixx: 0.000271234
      ixy: -5.48e-07
      ixz: 8.88e-07
      iyy: 0.000255654
      iyz: -1.0096e-05
      izz: 0.000193228
    wrist_3:
      ixx: 3.7388e-05
