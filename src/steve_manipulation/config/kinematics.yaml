# Inverse kinematics for the UR5e planning group.
# KDL is the generic numerical solver that ships with MoveIt. It is slower
# than a UR-specific analytic plugin, but it does not need extra packages
# and works with our tf_prefix (ur5e, no underscore).
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
