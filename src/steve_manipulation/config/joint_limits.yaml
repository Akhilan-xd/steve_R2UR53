# MoveIt overlay on top of the URDF limits. Scaling factors keep simulated
# motions conservative so Gazebo tracking stays stable.
default_velocity_scaling_factor: 0.15
default_acceleration_scaling_factor: 0.05

joint_limits:
  ur5eshoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  ur5eshoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  ur5eelbow_joint:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  ur5ewrist_1_joint:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  ur5ewrist_2_joint:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  ur5ewrist_3_joint:
    has_velocity_limits: true
